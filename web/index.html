<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>LUDOMAN Case</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top-bar">
    <h1>LUDOMAN <span>CASE</span></h1>
    <div class="balance-box">
      Баланс: <span id="balance">0</span> 🪙
    </div>
  </header>

  <main id="app">
    <section class="cases-section">
      <h2>🎁 Кейсы</h2>
      <div class="cases">
        <article class="case-card">
          <h3>🟢 Начальный</h3>
          <p>Стоимость: 100 🪙</p>
          <button class="open-btn" data-price="100">Открыть кейс</button>
        </article>

        <article class="case-card">
          <h3>🔵 Редкий</h3>
          <p>Стоимость: 250 🪙</p>
          <button class="open-btn" data-price="250">Открыть кейс</button>
        </article>

        <article class="case-card">
          <h3>🟣 Элитный</h3>
          <p>Стоимость: 500 🪙</p>
          <button class="open-btn" data-price="500">Открыть кейс</button>
        </article>
      </div>
    </section>

    <section id="case-animation"></section>

    <nav class="bottom-menu">
      <button id="inventory-btn">🎒 Инвентарь</button>
      <button id="profile-btn">👤 Профиль</button>
    </nav>

    <section id="inventory"></section>
    <section id="profile"></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
