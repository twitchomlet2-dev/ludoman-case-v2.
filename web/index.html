
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>LUDOMAN Case</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top-bar">
    <h1>LUDOMAN <span>CASE</span></h1>

    <div class="balance-box">
      Баланс: <span id="balance">0</span> ⭐
    </div>
  </header>

  <main id="app">

    <!-- Пополнение внутреннего баланса -->
    <section id="ludoman-topup"></section>

    <!-- Единственный список кейсов -->
    <section class="cases-section">
      <h2>🎮 Кейсы LUDOMAN</h2>
      <p class="muted">
        Кейсы открываются за внутренний баланс.
        Пополни баланс через Telegram Stars.
      </p>

      <div id="ludoman-cases" class="cases"></div>
    </section>

    <!-- Результат открытия кейса -->
    <section id="case-animation"></section>

    <!-- Нижнее меню -->
    <nav class="bottom-menu">
      <button id="inventory-btn" type="button">🎒 Инвентарь</button>
      <button id="profile-btn" type="button">👤 Профиль</button>
    </nav>

    <section id="inventory"></section>
    <section id="profile"></section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
